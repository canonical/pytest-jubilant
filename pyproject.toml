[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-jubilant"
dynamic = ["version"]

description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"  # lower bound set by jubilant
dependencies = [
    "jubilant>=1,<2",
    "pytest>=9.1.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"

[dependency-groups]
lint = [
    "pyright~=1.1",
    "ruff~=0.15",
]
unit = [
    "coverage[toml]~=7.6",
    "pytest~=9.1",
]
integration = [
    "coverage[toml]~=7.6",
    "pytest~=9.1",
    "ops>=2,<4",
]
# Tool versions consumed by CI workflows. Pinned here so pyproject.toml /
# uv.lock is the single source of truth — workflows run these via
# `uv run --only-group <name> <tool> …` (or `uv export --only-group <name>`
# when the tool must be installed into the system environment).
tox = [
    "tox~=4.25",
    "tox-uv~=1.13",
]
zizmor = [
    "zizmor~=1.23",
]
tiobe = [
    # These deps are only ever installed on the TIOBE runner, so we scope
    # resolution to that runner's interpreter. This keeps the universal lock
    # resolvable if a tool's requires-python later floats above this
    # project's own (>=3.10).
    "flake8~=7.3 ; python_version == '3.12.*'",
    "pylint~=4.0 ; python_version == '3.12.*'",
]

[tool.uv]
# Rolling quarantine: never resolve against packages published in the last 7
# days, so a compromised release has a window to be caught/yanked upstream
# before it can reach this project via a manual `uv add`, a `uv lock` regen,
# a uvx bootstrap, or a CI re-resolve. Complements (doesn't replace) the
# Dependabot cooldown, which only protects Dependabot-authored PRs.
exclude-newer = "7 days"

[tool.setuptools.dynamic]
version = {attr = "pytest_jubilant._version.__version__"}

[project.urls]
Homepage = "https://github.com/canonical/pytest-jubilant"
Issues = "https://github.com/canonical/pytest-jubilant/issues"

[project.entry-points.pytest11]
pytest-jubilant = "pytest_jubilant._main"

[tool.pytest.ini_options]
# Promote warnings (deprecations, resource-cleanup leaks, etc.) to errors so
# they surface in CI rather than going unnoticed.
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",  # Pyflakes
    "E",  # Pycodestyle errors
    "W",  # Pycodestyle warnings
    "unsorted-imports",  # I001 (isort)
    "N",  # pep8-naming
    "A",  # flake8-builtins
    "CPY",  # flake8-copyright
    "UP",  # pyupgrade
    "YTT",  # flake8-2020
    "S",  # flake8-bandit
    "B",  # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff specific
    "PERF",  # Perflint
    "FA",  # flake8-future-annotations
    "TC",  # flake8-type-checking
    "D",  # pyflakes-docstrings
]
ignore = [
    # Incompatible with D211 (blank-line-before-class).
    "incorrect-blank-line-before-class",  # D203
    # Incompatible with D212 (multi-line-summary-first-line).
    "multi-line-summary-second-line",  # D213
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "CPY",  # Copyright headers
    "D",  # Documentation
    "assert",  # S101
    "useless-expression",  # B018
    "multiple-with-statements",  # SIM117: FIXME: use a single `with` statement
]
"pytest_jubilant/__init__.py" = [
    "missing-trailing-period",  # D400
]
"pytest_jubilant/_main.py" = [
    "line-too-long",  # E501: FIXME
    "root-logger-call",  # LOG015: FIXME
    "ambiguous-unicode-character-comment",  # RUF003: FIXME: ambiguous character '❯'
    # The subprocess module is core functionality for this library.
    "suspicious-subprocess-import",  # S404
    # FIXME: construct the charmcraft run command more statically.
    "subprocess-without-shell-equals-true",  # S603
]
