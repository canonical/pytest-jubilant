name: dev
base: ubuntu@26.04
sdks:
  - name: uv
    channel: latest/stable
  # The project- prefix tells Workshop to load this SDK from .workshop/tools/
  # rather than the store, and the directory and the name in its sdk.yaml must
  # both match what follows the prefix. It installs tox, which the actions
  # below run, and the Pi agent harness along with node and npm, which Pi needs.
  - name: project-tools

# The checks CONTRIBUTING.md asks for before pushing.
#
# There is deliberately no integration action. Those tests need packed charms
# and a Juju controller to deploy them to, and an unprivileged container has
# neither. Run them on the host instead:
#
#   SMOKE_CHARM_PATH=... tox -e integration
actions:
  format: tox -e format -- "$@"
  lint: tox -e lint -- "$@"
  unit: tox -e unit -- "$@"
